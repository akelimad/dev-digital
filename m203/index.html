<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>M203 – Gestion de données · Cours MySQL</title>
<style>
:root{--side:#141b2d;--side2:#1d2740;--sidetx:#c5ccdc;--mut:#8591ab;--ac:#7aa2ff;--bg:#eef1f7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0d121d}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;grid-template-columns:290px 1fr;overflow:hidden}
.side{background:var(--side);color:var(--sidetx);display:flex;flex-direction:column;height:100%;overflow-y:auto}
.brand{padding:26px 22px 18px;border-bottom:1px solid #26314d}
.brand b{display:block;color:#fff;font-size:1.15rem;line-height:1.25}
.brand span{display:block;margin-top:6px;font-size:.85rem;color:var(--mut)}
nav{padding:12px 10px;flex:1}
nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;margin:2px 0;border-radius:10px;color:var(--sidetx);text-decoration:none;font-size:.97rem;border-left:3px solid transparent}
nav a:hover{background:var(--side2);color:#fff}
nav a[aria-current="page"]{background:var(--side2);color:#fff;font-weight:600;border-left-color:var(--c)}
nav a i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;font-style:normal;font-size:.8rem;font-weight:700;display:grid;place-items:center}
nav a small{display:block;color:var(--mut);font-size:.76rem;font-weight:400}
.foot{padding:14px 22px 20px;border-top:1px solid #26314d;font-size:.82rem}
.foot a{color:var(--ac)}
.view{position:relative;height:100%;min-width:0}
iframe{border:0;width:100%;height:100%;display:block;background:#fff}
.bar{display:none}
@media (max-width:820px){
 body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
 .bar{display:flex;align-items:center;gap:12px;background:var(--side);color:#fff;padding:10px 14px}
 .bar button{font:inherit;background:var(--side2);color:#fff;border:1px solid #33405f;border-radius:8px;padding:7px 12px;cursor:pointer}
 .bar span{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .side{position:fixed;inset:0 auto 0 0;width:min(310px,86vw);z-index:5;transform:translateX(-100%);transition:transform .2s}
 body.open .side{transform:none;box-shadow:0 0 0 100vmax #0008}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
a:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<div class="bar"><button id="menu" aria-label="Ouvrir le menu">☰ Menu</button><span id="cur"></span></div>
<aside class="side" id="side">
  <div class="brand"><b>M203 – Gestion de données</b><span>Cours MySQL · base Glogiciels</span></div>
  <nav id="nav" aria-label="Chapitres"></nav>
  <div class="foot"><a id="solo" href="#" target="_blank" rel="noopener">Ouvrir cette page seule ↗</a></div>
</aside>
<main class="view"><iframe id="frame" title="Contenu du cours"></iframe></main>
<script>
var PAGES=[
 {id:"tables-temporaires",t:"Tables temporaires",s:"CREATE TEMPORARY TABLE",f:"pages/tables-temporaires.html",c:"#1f7a6c"},
 {id:"vues",t:"Les vues",s:"CREATE VIEW",f:"pages/vues.html",c:"#2563eb"},
 {id:"fonctions",t:"Les fonctions",s:"CREATE FUNCTION · RETURN",f:"pages/fonctions.html",c:"#0e9fbc"},
 {id:"procedures",t:"Les procédures",s:"CREATE PROCEDURE · IN / OUT",f:"pages/procedures.html",c:"#7c3aed"},
 {id:"verrouillage",t:"Verrouillage des tables",s:"LOCK TABLES · UNLOCK",f:"pages/verrouillage.html",c:"#c2410c"},
 {id:"structures-controle",t:"Structures de contrôle",s:"IF · CASE · WHILE · LOOP",f:"pages/structures-controle.html",c:"#4f46e5"}
];
var nav=document.getElementById("nav"),frame=document.getElementById("frame"),
    cur=document.getElementById("cur"),solo=document.getElementById("solo");
PAGES.forEach(function(p,i){
  var a=document.createElement("a");
  a.href="#"+p.id;a.dataset.id=p.id;a.style.setProperty("--c",p.c);
  a.innerHTML="<i>"+(i+1)+"</i><span>"+p.t+"<small>"+p.s+"</small></span>";
  nav.appendChild(a);
});
function route(){
  var id=location.hash.slice(1),p=PAGES.filter(function(x){return x.id===id})[0]||PAGES[0];
  if(frame.getAttribute("src")!==p.f)frame.src=p.f;
  nav.querySelectorAll("a").forEach(function(a){
    if(a.dataset.id===p.id)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");
  });
  document.title=p.t+" · M203 Gestion de données";
  cur.textContent=p.t;solo.href=p.f;
  document.body.classList.remove("open");
}
document.getElementById("menu").onclick=function(){document.body.classList.toggle("open")};
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
